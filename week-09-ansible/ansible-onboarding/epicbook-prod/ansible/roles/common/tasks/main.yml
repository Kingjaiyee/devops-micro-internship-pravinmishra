---
- name: Install baseline packages, refreshing the apt cache only if older than an hour
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - ca-certificates
      - mysql-client
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove temporary EpicBook risk test file
  ansible.builtin.file:
    path: /tmp/epicbook-risk-test
    state: absent
