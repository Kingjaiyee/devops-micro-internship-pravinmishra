---
- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: Clone EpicBook at a pinned commit
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dest }}"
    version: "{{ app_version }}"
  become: true
  become_user: "{{ app_user }}"
  register: epicbook_repo
  notify: Reload EpicBook

- name: Check whether dependencies are installed
  ansible.builtin.stat:
    path: "{{ app_dest }}/node_modules"
  register: epicbook_node_modules

- name: Install Node.js dependencies exactly as locked (only when code changed or missing)
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: "{{ app_dest }}"
  become: true
  become_user: "{{ app_user }}"
  when: epicbook_repo.changed or not epicbook_node_modules.stat.exists
  changed_when: true
  notify: Reload EpicBook

- name: Create a root-only directory for the database client config
  ansible.builtin.file:
    path: /etc/epicbook
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the MySQL client option file (keeps the password off the command line)
  ansible.builtin.template:
    src: mysql-client.cnf.j2
    dest: /etc/epicbook/mysql-client.cnf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Check whether the Book table already exists
  ansible.builtin.command: >-
    mysql --defaults-extra-file=/etc/epicbook/mysql-client.cnf -N -e
    "SELECT COUNT(*) FROM information_schema.tables
    WHERE table_schema='{{ db_name }}' AND table_name='Book'"
  register: epicbook_book_table
  check_mode: false
  changed_when: false

- name: Import the schema and seed data in order (only into an empty database)
  ansible.builtin.shell: >-
    mysql --defaults-extra-file=/etc/epicbook/mysql-client.cnf {{ db_name }}
    < {{ app_dest }}/db/{{ item }}
  loop:
    - BuyTheBook_Schema.sql
    - author_seed.sql
    - books_seed.sql
  when: epicbook_book_table.stdout | trim == "0"
  changed_when: true

- name: Write the PM2 ecosystem file with the database connection
  ansible.builtin.template:
    src: epicbook.config.js.j2
    dest: "{{ pm2_ecosystem_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  notify: Reload EpicBook

- name: Check whether EpicBook is already registered in PM2
  ansible.builtin.command: pm2 describe {{ pm2_app_name }}
  become: true
  become_user: "{{ app_user }}"
  register: epicbook_pm2
  check_mode: false
  changed_when: false
  failed_when: false

- name: Start EpicBook under PM2 when it is not running yet
  ansible.builtin.command: pm2 start {{ pm2_ecosystem_file }}
  become: true
  become_user: "{{ app_user }}"
  when: epicbook_pm2.rc != 0
  changed_when: true

- name: Register PM2 with systemd so the app survives a reboot
  ansible.builtin.command: >-
    pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  args:
    creates: /etc/systemd/system/pm2-{{ app_user }}.service

- name: Save the PM2 process list
  ansible.builtin.command: pm2 save
  become: true
  become_user: "{{ app_user }}"
  changed_when: false
